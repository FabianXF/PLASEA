<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reporte</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom right, #00c9a7, #1e3c72);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .form-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-header img {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
        }

        .form-header h4 {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .form-header p {
            margin: 5px 0 0;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 1rem;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #00ffe7;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit,
        .btn-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin: 10px 5px;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
        }

        .btn-submit:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        .btn-link {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
        }

        .btn-link:hover {
            background-color: rgba(0, 0, 0, 0.85);
            transform: translateY(-2px);
        }

        .btn-submit:active,
        .btn-link:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                max-width: 95%;
            }

            h2 {
                font-size: 20px;
            }

            .form-header h4 {
                font-size: 1.5rem;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                font-size: 0.9rem;
                padding: 8px;
            }

            .btn-submit,
            .btn-link {
                font-size: 0.9rem;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-header">
            <img src="/images/logo.png" alt="Logo" th:src="@{/images/logo.png}" onerror="this.style.display='none'">
            <h4><i class="fas fa-user-shield"></i> Administrador</h4>
            <p>Editar Reporte</p>
        </div>
        <h2><i class="fas fa-edit"></i> Editar Reporte</h2>
        <form id="editReporteForm" th:action="@{/reporte/actualizar/{id}(id=${reporte.idReporte})}" method="post">
            <div class="form-group">
                <label for="cedula">Cédula del Profesor:</label>
                <input type="text" id="cedula" name="cedula" th:value="${reporte.usuario.idUsuario}" readonly />
            </div>
            <div class="form-group">
                <label for="carrera">Carrera:</label>
                <input type="text" id="carrera" name="carrera" th:value="${reporte.carrera.nombre}" readonly />
                <input type="hidden" name="idCarrera" th:value="${reporte.carrera.idCarrera}" />
            </div>
            <div class="form-group">
                <label for="asignatura">Asignatura:</label>
                <input type="text" id="asignatura" name="asignatura" th:value="${reporte.asignatura.nombre}" readonly />
                <input type="hidden" name="idAsignatura" th:value="${reporte.asignatura.idAsignatura}" />
            </div>
            <div class="form-group">
                <label for="curso">Curso:</label>
                <input type="text" id="curso" name="curso" th:value="${reporte.curso.semestreAcademico + ' - Grupo ' + reporte.curso.grupo}" readonly />
                <input type="hidden" name="idCurso" th:value="${reporte.curso.idCurso}" />
            </div>
            <div class="form-group">
                <label for="estudiante">Estudiante:</label>
                <input type="text" id="estudiante" name="estudiante" th:value="${reporte.estudiante.nombre}" readonly />
                <input type="hidden" name="idEstudiante" th:value="${reporte.estudiante.idEstudiante}" />
            </div>
            <div class="form-group">
                <label for="motivo">Motivo:</label>
                <input type="text" id="motivo" name="motivo" th:value="${reporte.motivo}" required />
            </div>
            <div class="form-group">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" th:value="${reporte.fecha}" required />
            </div>
            <div class="form-group">
                <label for="calificacion">Calificación:</label>
                <input type="number" id="calificacion" name="calificacion" step="0.01" min="0" max="5" th:value="${reporte.calificacion}" />
            </div>
            <div class="form-group">
                <label for="comentario">Comentario (Opcional):</label>
                <textarea id="comentario" name="comentario" th:text="${reporte.comentario}"></textarea>
            </div>
            <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Guardar Cambios</button>
            <a th:href="@{/inicio}" class="btn-link"><i class="fas fa-arrow-left"></i> Regresar</a>
        </form>
    </div>
</body>
</html>
